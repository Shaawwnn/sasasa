name: validate

on:
  push:
  pull_request:

jobs:
  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          jq -e . .claude-plugin/plugin.json > /dev/null
          jq -e . .claude-plugin/marketplace.json > /dev/null

      - name: Manifests have required fields
        run: |
          jq -e '.name and .description' .claude-plugin/plugin.json > /dev/null
          jq -e '.name and .owner.name and (.plugins | length > 0)' .claude-plugin/marketplace.json > /dev/null

      - name: Every marketplace plugin source resolves
        run: |
          jq -r '.plugins[].source' .claude-plugin/marketplace.json | while read -r src; do
            test -d "$src" || { echo "::error::source does not exist: $src"; exit 1; }
          done

      - name: No personal paths
        run: |
          # a path from one machine breaks silently for everyone else
          if grep -rnE '/(Users|home)/[a-z]' --include='*.md' --include='*.json' --include='*.sh' \
               --exclude-dir=.git . ; then
            echo "::error::personal path found - use \${CLAUDE_PLUGIN_ROOT} or /path/to/..."
            exit 1
          fi

      - name: Skills use the <name>/SKILL.md layout
        run: |
          # a flat .md in skills/ is never discovered by Claude Code
          flat=$(find skills -maxdepth 1 -name '*.md')
          if [ -n "$flat" ]; then
            echo "::error::flat markdown in skills/ - move to skills/<name>/SKILL.md: $flat"
            exit 1
          fi
          for d in skills/*/; do
            test -f "$d/SKILL.md" || { echo "::error::missing $d/SKILL.md"; exit 1; }
            name=$(sed -n 's/^name:[[:space:]]*//p' "$d/SKILL.md" | head -1)
            test "$name" = "$(basename "$d")" \
              || { echo "::error::$d SKILL.md name '$name' != directory name"; exit 1; }
          done

      - name: Hooks are portable and resolve
        run: |
          jq -e . hooks/hooks.json > /dev/null
          jq -r '.hooks[][].hooks[].args[0]' hooks/hooks.json | while read -r p; do
            case "$p" in
              '${CLAUDE_PLUGIN_ROOT}'/*) ;;
              *) echo "::error::hook path is not portable: $p"; exit 1 ;;
            esac
            f="${p/\$\{CLAUDE_PLUGIN_ROOT\}/.}"
            test -x "$f" || { echo "::error::hook script missing or not executable: $f"; exit 1; }
          done

      - name: Hook scripts parse
        run: for f in hooks/scripts/*.sh; do bash -n "$f"; done

      - name: Agent frontmatter is valid
        run: |
          for f in agents/*.md; do
            for key in name description model; do
              grep -q "^$key:" "$f" || { echo "::error::$f missing '$key:'"; exit 1; }
            done
            name=$(sed -n 's/^name:[[:space:]]*//p' "$f" | head -1)
            test "$name" = "$(basename "$f" .md)" \
              || { echo "::error::$f name '$name' != filename"; exit 1; }
          done

      - name: Command frontmatter is valid
        run: |
          for f in commands/*.md; do
            head -1 "$f" | grep -q '^---$' || { echo "::error::$f has no frontmatter"; exit 1; }
            grep -q '^description:' "$f" || { echo "::error::$f missing 'description:'"; exit 1; }
          done

      - name: Commands reference agents that exist
        run: |
          grep -ohE '\*\*[a-z-]+\*\*' commands/*.md | tr -d '*' | sort -u | while read -r a; do
            test -f "agents/$a.md" || { echo "::error::command references unknown agent: $a"; exit 1; }
          done

      - name: No em dashes in prose
        # CLAUDE.md forbids them. Prose only; shell commands are unaffected.
        run: |
          if grep -rn '—' --include='*.md' --exclude-dir=.git . ; then
            echo "::error::em dashes found - CLAUDE.md says never use them"
            exit 1
          fi

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    # Advisory: not yet confirmed whether `claude plugin validate` runs without
    # authentication on a CI runner. Once verified, drop continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
