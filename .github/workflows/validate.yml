name: validate

on:
  push:
  pull_request:

jobs:
  structure:
    name: Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No personal paths
        run: |
          # a path from one machine breaks silently for everyone else
          if grep -rnE '/(Users|home)/[a-z]' --include='*.md' --include='*.json' --include='*.sh' \
               --exclude-dir=.git . ; then
            echo "::error::personal path found - use \${CLAUDE_PLUGIN_ROOT} or /path/to/..."
            exit 1
          fi

      - name: Skills use the <name>/SKILL.md layout
        run: |
          # a flat .md in skills/ is never discovered by Claude Code
          flat=$(find skills -maxdepth 1 -name '*.md')
          if [ -n "$flat" ]; then
            echo "::error::flat markdown in skills/ - move to skills/<name>/SKILL.md: $flat"
            exit 1
          fi
          for d in skills/*/; do
            test -f "$d/SKILL.md" || { echo "::error::missing $d/SKILL.md"; exit 1; }
            name=$(sed -n 's/^name:[[:space:]]*//p' "$d/SKILL.md" | head -1)
            test "$name" = "$(basename "$d")" \
              || { echo "::error::$d SKILL.md name '$name' != directory name"; exit 1; }
          done

      - name: Hooks are portable, resolve, and parse
        run: |
          jq -r '.hooks[][].hooks[].args[0]' hooks/hooks.json | while read -r p; do
            case "$p" in
              '${CLAUDE_PLUGIN_ROOT}'/*) ;;
              *) echo "::error::hook path is not portable: $p"; exit 1 ;;
            esac
            f="${p/\$\{CLAUDE_PLUGIN_ROOT\}/.}"
            test -x "$f" || { echo "::error::hook script missing or not executable: $f"; exit 1; }
          done
          for f in hooks/scripts/*.sh; do bash -n "$f"; done

      - name: Commands reference agents that exist
        run: |
          # commands are thin delegators; a renamed agent breaks them silently
          grep -ohE '\*\*[a-z-]+\*\*' commands/*.md | tr -d '*' | sort -u | while read -r a; do
            test -f "agents/$a.md" || { echo "::error::command references unknown agent: $a"; exit 1; }
          done

  manifests:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate . --strict
